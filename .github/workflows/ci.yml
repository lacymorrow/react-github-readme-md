name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # node-sass is deprecated. --ignore-scripts skips its native compile.
      # A real build job can be added once the build pipeline is verified
      # green on every Node version listed below.
      - run: npm install --ignore-scripts

      - name: Verify package.json
        run: node -e "const p=require('./package.json'); if(!p.main||!p.module||!p.types) process.exit(1)"

      - name: Verify pre-built dist/ is present
        run: |
          test -f dist/cjs/index.js
          test -f dist/esm/index.js
          test -f dist/index.d.ts
