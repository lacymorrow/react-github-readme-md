name: Release

# Publishes to npm when a version tag is pushed. There is no NPM_TOKEN in this
# repo: npm gets its credential from GitHub's OIDC provider at publish time
# (npm trusted publishing), so `id-token: write` on the publish job is
# load-bearing. Provenance attaches automatically for a public package in a
# public repo. Same shape as lacymorrow/album-art release.yml (LAC-6337).
#
# Two jobs on purpose. `id-token: write` is job-wide, so any step in a job that
# holds it can mint an npm credential. Everything that runs third-party code
# (`npm install`, jest, rollup) lives in `verify`, which has no id-token.
# `publish` runs no third-party JS: checkout, setup-node, compare tag to
# package.json, publish.
#
# dist/ is committed and `files` ships only dist/. `publish` therefore runs
# `npm publish --ignore-scripts` (skips prepublishOnly's rollup, which needs
# node_modules) and `verify` proves the committed dist matches a fresh build.
# Source maps are excluded from that comparison: they embed build-path data and
# differ between machines.
#
# One-time setup on npmjs.com, package react-github-readme-md,
# Settings -> Trusted publisher:
#   Publisher: GitHub Actions
#   Organization or user: lacymorrow
#   Repository: react-github-readme-md
#   Workflow filename: release.yml   (filename only, must match this file)
#   Environment: leave blank (any pushed v* tag publishes, no approval click)
# npm does not validate the config on save, fields are case sensitive, it
# cannot be edited, and it expires unless its first publish lands within 2
# days. So cut the release tag right after saving it.
#
# Needs npm >= 11.5.1, Node >= 22.14.0, and a cloud-hosted runner.
#
# Actions are pinned by SHA (unlike ci.yml) because this file can mint a
# publish credential. Dependabot (github-actions, monthly) keeps them current.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify build and tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # node-sass is deprecated; --ignore-scripts skips its native compile,
      # same as ci.yml.
      - run: npm install --ignore-scripts

      - name: Run test suite
        run: npm test

      - name: Committed dist/ matches a fresh build
        run: |
          npm run build
          if ! git diff --exit-code -- dist ':(exclude)*.map'; then
            echo "dist/ is stale: run npm run build and commit before tagging" >&2
            exit 1
          fi

      - name: Tarball contains the entry points
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const pkg = require("./package.json");
            const [meta] = JSON.parse(execSync("npm pack --dry-run --json").toString());
            const shipped = new Set(meta.files.map((f) => f.path));
            const missing = [pkg.main, pkg.module, pkg.types].filter((f) => !shipped.has(f));
            if (missing.length) {
              console.error("not in the tarball: " + missing.join(", "));
              process.exit(1);
            }
            console.log("tarball ok: " + shipped.size + " files");
          '

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest # trusted publishing does not work on self-hosted runners
    permissions:
      contents: read
      id-token: write # required for OIDC; without it npm publish has no credential

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm is new enough for OIDC
        run: |
          need=11.5.1
          have=$(npm -v)
          echo "npm $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have cannot publish via OIDC; need >= $need" >&2
            exit 1
          fi

      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME is $tag but package.json is $pkg" >&2
            exit 1
          fi

      # --ignore-scripts: no node_modules here on purpose, and verify already
      # proved the committed dist/ is current.
      - name: Publish
        run: npm publish --access public --ignore-scripts # credential comes from OIDC, not a token
